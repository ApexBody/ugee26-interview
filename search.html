<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Interview Status</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="search-page">
    <header class="topbar">
        <div class="topbar-left">
            <div class="title">Search Interview Status</div>
            <div class="topbar-info">
                <div class="info-line">
                    <span class="info-label">Emergency Number:</span>
                    <span class="info-value">+91 88867 89065</span>
                </div>
                <div class="info-line">
                    <span class="info-label">Ambulance Aarogya Number:</span>
                    <span class="info-value">+91 99891 38983</span>
                </div>
            </div>
        </div>
        <nav class="topbar-links">
            <a href="index.html">Board</a>
        </nav>
    </header>

    <section class="search-panel">
        <label class="search-label" for="search-input">Search by name or admission ID</label>
        <div class="search-row">
            <input
                id="search-input"
                class="search-input"
                type="text"
                placeholder="Type a name or ID"
                autocomplete="off"
            >
            <button id="clear-search" class="search-button" type="button">Clear</button>
        </div>
        <div class="search-meta">
            <span id="results-count">0 results</span>
            <span id="status-message">Loading data...</span>
        </div>
    </section>

    <table id="search-results">
        <thead>
            <tr>
                <th class="id-column">Admission ID</th>
                <th class="name-column">Name</th>
                <th class="status-column">Status</th>
            </tr>
        </thead>
        <tbody id="results-body" class="fade">
        </tbody>
    </table>

    <script>
        // --- CONFIGURATION ---
        const API_URL = 'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnSJDgxy6PQ55wOQ2pbaEPpIEqDFsTaIc8V2Nkob1oNbH3HJT87eE_CJUtJiyQ7doDdHFFizFI9OJUxfmz7ZxJZtV9GoMcPfM9YDCbugyfRJHqcJEJCKmo9dRF8GuCyG9hM4qJHodT52Q_ARoQgCCpzCrZ7ByV61uXprKRJSpA2EGKecS8r0DXRJsBfmOX6RZ9DAJZtOuiqjpUkdjgwl-lY5L40U5CnOaMNdwcud2n3iQ5BzDVKfIYFWjxsBacIZQXdvyhl_avYwvEMKQ6hVRvXzLgaxag&lib=MW1jJ9x95b1IglBa3N1Y3LLxEVFa3CZ3r';
        const POLLING_INTERVAL_MS = 120000;

        let allCandidates = [];

        const searchInput = document.getElementById('search-input');
        const resultsBody = document.getElementById('results-body');
        const resultsCount = document.getElementById('results-count');
        const statusMessage = document.getElementById('status-message');
        const clearButton = document.getElementById('clear-search');

        async function fetchCandidateData() {
            statusMessage.textContent = 'Refreshing data...';
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                const normalizedData = normalizeCandidateData(data);

                const allowedStatuses = ['REGISTERED', 'IN PROGRESS', 'INTERVIEW DONE', "YET TO ARRIVE", "COMPLETED"];
                allCandidates = normalizedData.filter(candidate => 
                    allowedStatuses.includes(normalizeStatus(candidate.State))
                );
                statusMessage.textContent = 'Ready';
                filterAndRender();
            } catch (error) {
                console.error('Error fetching data:', error);
                statusMessage.textContent = 'Unable to load data';
            }
        }

        function getStatusClass(state) {
            const normalizedState = normalizeStatus(state);
            if (normalizedState === 'UNKNOWN') return 'status-unknown';
            const formattedState = normalizedState.toLowerCase().replace(/ /g, '-');
            return `status-${formattedState}`;
        }

        function normalizeStatus(status) {
            if (!status) return 'UNKNOWN';
            const baseStatus = String(status).toUpperCase().split('(')[0].trim();
            if (baseStatus === 'IN PROCESS') return 'IN PROGRESS';
            return baseStatus || 'UNKNOWN';
        }

        function normalizeValue(value) {
            return String(value || '').toLowerCase();
        }

        function normalizeCandidateData(data) {
            if (!Array.isArray(data)) {
                return Array.isArray(data?.data) ? data.data : data;
            }

            if (!Array.isArray(data[0])) {
                return data;
            }

            const header = data[0].map(value => String(value || '').trim().toUpperCase());
            const appIndex = header.indexOf('APPLICATION NUMBER');
            const nameIndex = header.indexOf('NAME');
            const statusIndex = header.indexOf('STATUS');
            const hasHeader = appIndex !== -1 || nameIndex !== -1 || statusIndex !== -1;
            const startIndex = hasHeader ? 1 : 0;
            const fallback = data[startIndex]?.length >= 4
                ? { app: 1, name: 2, status: 3 }
                : { app: 0, name: 1, status: 2 };
            const appCol = appIndex !== -1 ? appIndex : fallback.app;
            const nameCol = nameIndex !== -1 ? nameIndex : fallback.name;
            const statusCol = statusIndex !== -1 ? statusIndex : fallback.status;

            return data.slice(startIndex).map(row => ({
                Admission_ID: row[appCol],
                Name: row[nameCol],
                State: row[statusCol]
            }));
        }

        function filterCandidates(query) {
            const normalizedQuery = normalizeValue(query).trim();
            if (!normalizedQuery) {
                return allCandidates;
            }

            return allCandidates.filter(candidate => {
                const name = normalizeValue(candidate.Name);
                const id = normalizeValue(candidate.Admission_ID);
                return name.includes(normalizedQuery) || id.includes(normalizedQuery);
            });
        }

        function renderResults(results, query) {
            resultsBody.classList.remove('fade');
            void resultsBody.offsetWidth;
            resultsBody.classList.add('fade');

            const table = document.getElementById('search-results');
            const trimmedQuery = String(query || '').trim();

            if (results.length === 0) {
                const emptyMessage = trimmedQuery
                    ? 'No matches found for your search'
                    : 'No participants available';

                resultsBody.innerHTML = `
                    <tr class="empty-row">
                        <td colspan="3">${emptyMessage}</td>
                    </tr>
                `;
                table.classList.add('is-empty');
            } else {
                resultsBody.innerHTML = results.map(candidate => `
                    <tr>
                        <td class="id-column">${candidate.Admission_ID || '---'}</td>
                        <td class="name-column">${candidate.Name || '---'}</td>
                        <td><span class="status ${getStatusClass(candidate.State)}">${candidate.State || 'UNKNOWN'}</span></td>
                    </tr>
                `).join('');
                table.classList.remove('is-empty');
            }

            resultsCount.textContent = `${results.length} result${results.length === 1 ? '' : 's'}`;
        }

        function filterAndRender() {
            const query = searchInput.value;
            const results = filterCandidates(query);
            renderResults(results, query);
        }

        searchInput.addEventListener('input', filterAndRender);
        clearButton.addEventListener('click', () => {
            searchInput.value = '';
            filterAndRender();
            searchInput.focus();
        });

        window.onload = () => {
            fetchCandidateData();
            setInterval(fetchCandidateData, POLLING_INTERVAL_MS);
        };
    </script>
</body>
</html>
