<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Status Board</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="topbar">
        <div class="topbar-left">
            <div class="title">Interview Status Board</div>
            <div class="topbar-info">
                <div class="info-line">
                    <span class="info-label">Emergency Number:</span>
                    <span class="info-value">+91 88867 89065</span>
                </div>
                <div class="info-line">
                    <span class="info-label">Ambulance Aarogya Number:</span>
                    <span class="info-value">+91 99891 38983</span>
                </div>
            </div>
        </div>
        <nav class="topbar-links">
            <a href="search.html">Search</a>
        </nav>
    </header>

    <table id="board">
        <thead>
            <tr>
                <th class="id-column">Application Number</th>
                <th class="name-column">Name</th>
                <th class="status-column">Status</th>
            </tr>
        </thead>
        <tbody id="board-body" class="fade">
            </tbody>
    </table>

    <footer id="page-indicator">Loading Data...</footer>

    <script>
        // Redirect mobile users to search page (board is for TV display)
        if (window.innerWidth <= 900 && !window.location.search.includes('force')) {
            window.location.href = 'search.html';
        }

        // --- CONFIGURATION ---
        // Ensure this matches your active deployment URL
        const API_URL = 'https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnRGOiZq6dwg2D6OGNxPJht0WxnC4tRHk8rvpbpDv-5yPUzqcF3T39V32xelunTFZetsfiaxqQEv5ks9qiuf6mlB5CwsU4Oxe_EYuOy8iwUGI-p5_nnc2Kn0wxW5CfTOXcYSSws430ALksbhE4C_JBB4kYkpHMWzPqllN3yPMN8GdwPo26_fmQG7SKYOVIn5ZyFJn7dtYyuROYaH-bpWodhoWa5bi18Lu8zzwV0mRp7Ot445CcCdT140D2a4vyUt0XeCPnWWPaFyWTcatIGsUyv7yrClGA&lib=M7kVuKBPJpfgrTNQci04_A7xEVFa3CZ3r';
        
        const ITEMS_PER_PAGE = 15;
        const PAGINATION_INTERVAL_MS = 15000; // 15 seconds per screen
        const POLLING_INTERVAL_MS = 120000;   // 2 minutes
        
        let allCandidates = [];
        let currentPage = 0;
        let paginationTimer;

        // --- DATA FETCHING ---
        async function fetchCandidateData() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                const normalizedData = normalizeCandidateData(data);
                
                // Filter logic
                const allowedStatuses = ['REGISTERED', 'IN PROGRESS', 'INTERVIEW DONE'];
                allCandidates = normalizedData.filter(candidate => 
                    allowedStatuses.includes(normalizeStatus(candidate.State))
                );
                
                // Initial load trigger
                if (allCandidates.length > 0 && !paginationTimer) {
                    renderPage();
                    startPaginationLoop();
                }
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        // --- RENDERING LOGIC ---
        function getStatusClass(state) {
            const normalizedState = normalizeStatus(state);
            if (normalizedState === 'UNKNOWN') return 'status-unknown';
            const formattedState = normalizedState.toLowerCase().replace(/ /g, '-');
            return `status-${formattedState}`;
        }

        function normalizeCandidateData(data) {
            if (!Array.isArray(data)) {
                return Array.isArray(data?.data) ? data.data : data;
            }

            if (!Array.isArray(data[0])) {
                return data;
            }

            const header = data[0].map(value => String(value || '').trim().toUpperCase());
            const appIndex = header.indexOf('APPLICATION NUMBER');
            const nameIndex = header.indexOf('NAME');
            const statusIndex = header.indexOf('STATUS');
            const hasHeader = appIndex !== -1 || nameIndex !== -1 || statusIndex !== -1;
            const startIndex = hasHeader ? 1 : 0;
            const fallback = data[startIndex]?.length >= 4
                ? { app: 1, name: 2, status: 3 }
                : { app: 0, name: 1, status: 2 };
            const appCol = appIndex !== -1 ? appIndex : fallback.app;
            const nameCol = nameIndex !== -1 ? nameIndex : fallback.name;
            const statusCol = statusIndex !== -1 ? statusIndex : fallback.status;

            return data.slice(startIndex).map(row => ({
                Admission_ID: row[appCol],
                Name: row[nameCol],
                State: row[statusCol]
            }));
        }

        function normalizeStatus(status) {
            if (!status) return 'UNKNOWN';
            const baseStatus = String(status).toUpperCase().split('(')[0].trim();
            if (baseStatus === 'IN PROCESS') return 'IN PROGRESS';
            return baseStatus || 'UNKNOWN';
        }

        function renderPage() {
            if (allCandidates.length === 0) return;

            const totalPages = Math.ceil(allCandidates.length / ITEMS_PER_PAGE);
            
            if (currentPage >= totalPages) currentPage = 0;

            const startIndex = currentPage * ITEMS_PER_PAGE;
            const endIndex = startIndex + ITEMS_PER_PAGE;
            const pageData = allCandidates.slice(startIndex, endIndex);

            const tbody = document.getElementById('board-body');
            
            // Trigger reflow for CSS animation
            tbody.classList.remove('fade');
            void tbody.offsetWidth; 
            tbody.classList.add('fade');

            // Generate HTML with the new Name column
            tbody.innerHTML = pageData.map(candidate => `
                <tr>
                    <td class="id-column">${candidate.Admission_ID || '---'}</td>
                    <td class="name-column">${candidate.Name || '---'}</td>
                    <td><span class="status ${getStatusClass(candidate.State)}">${normalizeStatus(candidate.State)}</span></td>
                </tr>
            `).join('');

            document.getElementById('page-indicator').textContent = `Page ${currentPage + 1} of ${totalPages}`;
            currentPage = (currentPage + 1) % totalPages;
        }

        // --- TIMERS ---
        function startPaginationLoop() {
            paginationTimer = setInterval(renderPage, PAGINATION_INTERVAL_MS);
        }

        window.onload = () => {
            fetchCandidateData(); 
            setInterval(fetchCandidateData, POLLING_INTERVAL_MS); 
        };
    </script>
</body>
</html>
